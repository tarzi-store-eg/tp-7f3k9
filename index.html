<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ترزي | المعاينة</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="preview-app" title="معاينة متجر ترزي" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-downloads"></iframe>
<script>
(function () {
    const params = new URLSearchParams(location.search);
    const frame = document.getElementById('preview-app');
    const app = new URL('app/index.html', location.href);
    app.searchParams.set('p', params.get('p') || '/');
    if (params.get('role') === 'staff') app.searchParams.set('role', 'staff');
    app.searchParams.set('v', params.get('v') || '962');
    app.searchParams.set('t', String(Date.now()));
    frame.src = app.href;
    addEventListener('message', function (event) {
        if (event.origin !== location.origin || event.source !== frame.contentWindow) return;
        const route = event.data && event.data.tp;
        if (typeof route !== 'string' || !/^\/(?!\/)/.test(route)) return;
        const query = new URLSearchParams(location.search);
        query.set('p', route);
        history.replaceState(null, '', location.pathname + '?' + query.toString());
    });
})();
</script>
</body>
</html>
